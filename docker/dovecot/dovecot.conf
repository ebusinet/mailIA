# Serveur IMAP jetable, strict, pour la suite de tests.
#
# GreenMail est permissif : pas de STARTTLS, pas de recherche par sous-chaine,
# COPY vers une destination vide accepte. Ce serveur-ci est la pour exercer le
# comportement d'un serveur conforme. Il n'est PAS durci pour de la production :
# certificat auto-signe, mot de passe unique, authentification en clair autorisee.

protocols = imap lmtp submission

listen = *
log_path = /dev/stderr
info_log_path = /dev/stderr
auth_verbose = yes

# --- TLS : certificat auto-signe genere au demarrage ---
ssl = yes
ssl_cert = </etc/dovecot/ssl/cert.pem
ssl_key = </etc/dovecot/ssl/key.pem
ssl_min_protocol = TLSv1.2

# Le client de test se connecte en clair sur 143 ; STARTTLS reste propose,
# c'est lui qu'on veut exercer cote SMTP submission.
disable_plaintext_auth = no
auth_mechanisms = plain login

# --- Stockage ---
mail_home = /srv/mail/%u
mail_location = maildir:~/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000

namespace inbox {
  inbox = yes
  prefix =
  # Separateur explicite : GreenMail annonce "." tout en acceptant "/" dans les
  # noms, ce qui a masque un defaut de create_folder.
  separator = /
}

passdb {
  driver = static
  args = password=testpass123
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%u
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# --- Soumission SMTP (587, STARTTLS) relayee vers le LMTP local ---
# Rend le serveur autonome : un message envoye par MailIA atterrit dans la
# boite du destinataire sur CE serveur, sans relais externe.
service submission-login {
  inet_listener submission {
    port = 587
  }
}
submission_relay_host = 127.0.0.1
submission_relay_port = 24
submission_relay_trusted = yes
submission_max_mail_size = 50M

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}
lmtp_save_to_detail_mailbox = no

# Dossiers systeme crees d'office : la suite s'attend a les trouver.
namespace inbox {
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}
